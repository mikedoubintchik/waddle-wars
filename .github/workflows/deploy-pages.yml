name: Deploy web build to Pages

# The legacy branch builder repeatedly failed on this site ("Page build
# failed", no detail) once the payload included the ~40 MB WASM blob, leaving
# the live URL stuck on an old build. Publishing through the Pages artifact
# API instead is the supported modern path and skips that builder entirely.
#
# The build itself is still produced locally (tools/deploy_web.sh exports and
# force-pushes build/web to the gh-pages branch); this workflow just takes
# whatever that branch holds and publishes it.

# Dispatch-only: Actions reads workflow files from the branch being pushed,
# and gh-pages holds nothing but the exported build, so a push trigger there
# would never find this file. tools/deploy_web.sh fires it after each push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never publish two builds at once; let a newer push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

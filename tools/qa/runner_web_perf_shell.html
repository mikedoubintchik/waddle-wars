      webgl_trace: glTrace, presentation_trace: presentationTrace,
      render_trace: renderTrace, gl_all_trace: glAllTrace, shader_trace: shaderTrace,
      renderer_diagnostic: rendererInfo, page_errors: pageErrors};
  }
  async function sendResult(payload) {
    if (finished) return;
    // A fatal engine/script edge during the tiny preflight still restores the
    // method. Never accept a normal report whose preflight wrapper survived.
    if (readbackRestore) {
      payload.readback_witness_cleanup = JSON.parse(window.__wwRunnerReadbackEnd());
      if (payload.report) {
        payload.report.workload_valid = false;
        payload.error = "Readback preflight witness was not closed before world/timing";
        payload.error_source = "readback_witness_protocol";
      }
    }
    if (entryMode === "app" && payload.kind === undefined) payload.kind = "app_lifecycle";
    finished = true;
    startButton.disabled = true;
    startButton.hidden = true;
    captureButton.disabled = true;
    captureButton.hidden = true;
    marks.report = performance.now();
    captureCanvas("report");
    cancelAnimationFrame(rafID);
    trustedInputLatency.pending_raf_cancelled_at_finish = trustedInputRAFIDs.size;
    for (const inputRAFID of trustedInputRAFIDs) cancelAnimationFrame(inputRAFID);
    trustedInputRAFIDs.clear();
    payload.run_id = runConfig.run_id;
    payload.browser = browserMetadata();
    applyCanvasEligibility(payload, payload.browser.canvas_policy);
    window.__wwRunnerResult = payload;
    if (payload.error) statusNode.hidden = false;
    statusNode.textContent = "Saving report to localhost…";
    try {
      const response = await fetch("/report", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)});
      if (!response.ok) throw new Error("Collector HTTP " + response.status);
      statusNode.textContent = payload.error ? "Probe failed; saved local error: " + payload.error :
        entryMode === "app" ? "Saved app lifecycle snapshot — no FPS/performance gate evaluated" :
        canvasPolicyMode === "production" ? "Saved production-canvas diagnostic — " +
          (payload.report.measurement_eligibility.native_size_workload_accepted ? "workload eligible" : "workload ineligible") +
          "; fixed-resolution gate N/A" :
        "Saved local report — " + payload.report.average_fps + " FPS; p95 " + payload.report.p95_frame_ms +
          " ms; max " + payload.report.max_frame_ms + " ms; gate " + (payload.report.meets_gate ? "PASS" : "FAIL");
      document.title = payload.error ? "Runner probe failed" : "Runner probe complete";
    } catch (error) { statusNode.textContent = "Report save failed: " + String(error); }
  }
  window.__wwRunnerFinish = (report, csv) => entryMode === "app" ?
    window.__wwRunnerFail("Performance callback is invalid for app lifecycle entry", "entry_contract") :
    sendResult({report, csv});
  window.__wwRunnerFail = (error, source = "godot_probe", diagnostics = null) => {
    const payload = {error: String(error), error_source: source};
    if (entryMode !== "app" && diagnostics && typeof diagnostics === "object" && !Array.isArray(diagnostics)) {
      payload.diagnostics = diagnostics;
    }
    return sendResult(payload);
  };
  function captureAppLifecycle() {
    if (entryMode !== "app" || finished || marks.engine_started === undefined) return;
    marks.app_snapshot = performance.now();
    captureCanvas("app_snapshot");
    return sendResult({kind: "app_lifecycle", report: {
      schema_version: 1, measurement_kind: "app_lifecycle",
      scope: "Explicit browser-side full-app lifecycle snapshot; no engine FPS or performance gate",
      performance_gate_applicable: false, engine_fps_report_present: false,
      meets_gate: false, complete_production: false,
    }});
  }
  captureButton.addEventListener("click", captureAppLifecycle, {once: true});
  window.addEventListener("error", event => {
    if (finished) return;
    if (recordPageError("error", event) === "owned_engine_script") {
      window.__wwRunnerFail(event.message, "owned_engine_script_error");
    }
  });
  window.addEventListener("unhandledrejection", event => {
    if (!finished) recordPageError("unhandledrejection", event);
  });
  </script>
  <script src="$GODOT_URL" onerror="window.__wwRunnerFail('Engine script failed to load', 'engine_script_load')"></script>
  <script>
    try {
      const engine = new Engine($GODOT_CONFIG);
      const missing = Engine.getMissingFeatures({threads: runConfig.threads === true});
      if (missing.length) window.__wwRunnerFail("Missing browser features: " + missing.join(", "), "engine_features");
      else {
        let startRequested = false;
        const startDiagnostic = () => {
          if (startRequested || finished) return;
          startRequested = true;
          startButton.disabled = true;
          startButton.hidden = true;
          try {
            marks.engine_start = performance.now();
            captureCanvas("engine_start");
            engine.startGame({canvas: document.getElementById("canvas"), canvasResizePolicy: 0,
              // Local debugging is always silent; no persistent sound preference
              // or user save is changed. Audio work is outside this probe scope.
              args: ["--audio-driver", "Dummy"],
              onExit: code => { if (!finished) window.__wwRunnerFail("Engine exited without report: " + code, "engine_exit"); }
            }).then(() => {
              if (entryMode !== "app" || finished) return;
              marks.engine_started = performance.now();
              captureCanvas("engine_started");
              captureRendererInfo();
              statusNode.hidden = true;
              captureButton.hidden = false;
              document.title = "Waddle Wars — app lifecycle diagnostic";
            }, error => window.__wwRunnerFail(error, "engine_start"));
          } catch (error) { window.__wwRunnerFail(error, "engine_bootstrap"); }
        };
        if (manualStart && !finished) {
          // Keep the page/renderer available for PID selection and tracing,
          // without starting Godot or changing the measured game's settings.
          statusNode.textContent = "Ready — attach trace, then select Start diagnostic.";
          startButton.hidden = false;
          startButton.addEventListener("click", startDiagnostic, {once: true});
        } else startDiagnostic();
      }
    } catch (error) { window.__wwRunnerFail(error, "engine_bootstrap"); }
  </script>
</body>
</html>

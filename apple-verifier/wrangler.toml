name = "waddle-wars-apple-verifier"
main = "src/worker.mjs"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[rules]]
type = "Data"
globs = ["**/*.cer"]
fallthrough = false

# Private service binding only. No public route, token, receipt or user data
# belongs in this file. Configure the matching mode and App Store identity
# before linking APPLE_RECEIPT_VERIFIER from the commerce Worker.
[vars]
APPLE_VERIFIER_ENABLED = "false"
APPLE_BUNDLE_ID = "com.blubberandbyte.waddlewars"

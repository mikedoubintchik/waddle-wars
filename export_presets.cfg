<meta name='twitter:card' content='summary_large_image'>
<meta name='theme-color' content='#0b1522'><style>\n/* Boot splash: dancing penguins over Godot's own #status panel, so the wait\n   before WASM starts matches the in-game loading indicator. */\n#ww-boot { position: absolute; inset: 0; display: flex; flex-direction: column;\n  align-items: center; justify-content: center; gap: 18px; background: #0d1729;\n  z-index: 5; font-family: 'Noto Sans', Arial, sans-serif; color: #b8cce4; }\n#ww-boot.done { display: none; }\n#ww-boot .row { display: flex; gap: 10px; align-items: flex-end; }\n#ww-boot .p { width: 34px; height: 46px; position: relative;\n  animation: ww-bob 0.9s ease-in-out infinite; }\n#ww-boot .p:nth-child(2) { animation-delay: 0.2s; }\n#ww-boot .p:nth-child(3) { animation-delay: 0.4s; }\n#ww-boot .body { position: absolute; left: 4px; top: 8px; width: 26px; height: 34px;\n  background: #1f2942; border-radius: 50% 50% 46% 46%; }\n#ww-boot .belly { position: absolute; left: 10px; top: 16px; width: 14px; height: 22px;\n  background: #f5faff; border-radius: 50%; }\n#ww-boot .head { position: absolute; left: 8px; top: 0; width: 18px; height: 18px;\n  background: #1f2942; border-radius: 50%; }\n#ww-boot .eye { position: absolute; top: 6px; width: 4px; height: 4px;\n  background: #f5faff; border-radius: 50%; }\n#ww-boot .eye.l { left: 11px; } #ww-boot .eye.r { left: 19px; }\n#ww-boot .bill { position: absolute; left: 14px; top: 11px; width: 0; height: 0;\n  border-left: 4px solid transparent; border-right: 4px solid transparent;\n  border-top: 6px solid #fbb843; }\n#ww-boot .flip { position: absolute; top: 14px; width: 7px; height: 18px;\n  background: #1f2942; border-radius: 50%; }\n#ww-boot .flip.l { left: 0; transform-origin: top center; animation: ww-flapl 0.9s ease-in-out infinite; }\n#ww-boot .flip.r { right: 0; transform-origin: top center; animation: ww-flapr 0.9s ease-in-out infinite; }\n#ww-boot .feet { position: absolute; bottom: 0; left: 6px; width: 22px; height: 5px; }\n#ww-boot .feet i { position: absolute; width: 9px; height: 5px; background: #fbb843;\n  border-radius: 3px 3px 1px 1px; }\n#ww-boot .feet i:first-child { left: 0; } #ww-boot .feet i:last-child { right: 0; }\n#ww-boot .cap { font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; }\n@keyframes ww-bob { 0%,100% { transform: translateY(0) rotate(-4deg); }\n  50% { transform: translateY(-7px) rotate(4deg); } }\n@keyframes ww-flapl { 0%,100% { transform: rotate(12deg); } 50% { transform: rotate(-26deg); } }\n@keyframes ww-flapr { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(26deg); } }\n@media (prefers-reduced-motion: reduce) {\n  #ww-boot .p, #ww-boot .flip { animation-duration: 2.4s; }\n}\n</style>\n<script>\n// Inject the boot splash as early as possible and retire it once the engine\n// has drawn its first frames (the canvas gains a non-zero size).\n(function () {\n  function penguin() {\n    return '<div class=\"p\"><span class=\"flip l\"></span><span class=\"flip r\"></span>' +\n      '<span class=\"body\"></span><span class=\"belly\"></span><span class=\"head\"></span>' +\n      '<span class=\"eye l\"></span><span class=\"eye r\"></span><span class=\"bill\"></span>' +\n      '<span class=\"feet\"><i></i><i></i></span></div>';\n  }\n  function mount() {\n    if (document.getElementById('ww-boot')) return;\n    var el = document.createElement('div');\n    el.id = 'ww-boot';\n    el.innerHTML = '<div class=\"row\">' + penguin() + penguin() + penguin() + '</div>' +\n      '<div class=\"cap\">Waddling in\\u2026</div>';\n    document.body.appendChild(el);\n    var tries = 0;\n    var timer = setInterval(function () {\n      tries++;\n      var c = document.getElementById('canvas');\n      if ((c && c.clientWidth > 0 && c.clientHeight > 0 && tries > 6) || tries > 600) {\n        clearInterval(timer);\n        el.classList.add('done');\n      }\n    }, 100);\n  }\n  if (document.body) mount();\n  else document.addEventListener('DOMContentLoaded', mount);\n})();\n</script>\n"

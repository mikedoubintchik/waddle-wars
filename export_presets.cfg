<script>
// Plain-fetch bridge for the game's API calls: Godot's HTTPRequest has web
// quirks, so on web the game starts a request here and polls for the result.
(function () {
  var api = { seq: 0, results: {} };
  var pending = {};
  window.__ww_api = api;
  function request(url, options, redactError) {
    var id = ++api.seq;
    var controller = new AbortController();
    var entry = { controller: controller, timer: null };
    pending[id] = entry;
    function finish(result) {
      if (pending[id] !== entry) return;
      delete pending[id];
      clearTimeout(entry.timer);
      api.results[id] = result;
    }
    function unavailable() {
      return { done: true, ok: false, status: 0, body: '{\"error\":\"network_unavailable\"}' };
    }
    // Complete independently of fetch rejecting: a stalled body or a transport
    // that ignores abort must still release the game's pending callback.
    entry.timer = setTimeout(function () {
      finish(unavailable());
      controller.abort();
    }, 20000);
    options.signal = controller.signal;
    function failed(error) {
      finish(redactError ? unavailable() : { done: true, ok: false, status: 0, body: String(error) });
    }
    try {
      fetch(url, options).then(function (r) {
        return r.text().then(function (text) {
          finish({ done: true, ok: r.ok, status: r.status, body: text });
        });
      }).catch(failed);
    } catch (error) { failed(error); }
    return id;
  }
  api.start = function (method, url, token, body) {
    var headers = {};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    if (body) headers['Content-Type'] = 'application/json';
    return request(url, { method: method, headers: headers, body: body || undefined,
      credentials: 'omit', redirect: 'error', cache: 'no-store', referrerPolicy: 'no-referrer' }, false);
  };
  // A status-only deletion receipt is never a JWT, URL, cookie or request body.
  api.startReceipt = function (url, receipt) {
    var parsed;
    try { parsed = new URL(url); } catch (e) { return 0; }
    if (typeof receipt !== 'string' || !/^[a-f0-9]{64}$/.test(receipt) ||
        parsed.protocol !== 'https:' || parsed.username || parsed.password ||
        parsed.pathname !== '/api/account/deletion/receipt' || parsed.search || parsed.hash) return 0;
    return request(parsed.href, { method: 'GET', headers: { 'X-Waddle-Deletion-Receipt': receipt },

<script>
// Follow Godot's real downloaded-byte count, then keep this same surface over
// engine startup and the boot scene until the main menu has rendered. A CSS
// compositor animation remains fluid during Godot's synchronous callMain.
(function () {
  function mount() {
    var status = document.getElementById('status');
    var nativeBar = document.getElementById('status-progress');
    var notice = document.getElementById('status-notice');
    if (!status || !nativeBar || !notice || document.getElementById('ww-boot-layer')) return;
    nativeBar.setAttribute('aria-hidden', 'true');
    var layer = document.createElement('div');
    layer.id = 'ww-boot-layer';
    var card = document.createElement('div');
    card.id = 'ww-boot-card';
    var mascot = document.createElement('img');
    mascot.id = 'ww-boot-mascot';
    mascot.src = 'loader-courier-v3.webp';
    mascot.alt = '';
    var title = document.createElement('div');
    title.id = 'ww-boot-title';
    title.textContent = 'WADDLE WARS';
    var message = document.createElement('div');
    message.id = 'ww-boot-message';
    message.textContent = 'Gathering tiny snow boots…';
    var track = document.createElement('div');
    track.id = 'ww-progress-track';
    track.setAttribute('role', 'progressbar');
    track.setAttribute('aria-label', 'Downloading game files');
    track.setAttribute('aria-valuemin', '0');
    track.setAttribute('aria-valuemax', '100');
    track.setAttribute('aria-valuenow', '0');
    var fill = document.createElement('div');
    fill.id = 'ww-progress-fill';
    track.appendChild(fill);
    var retry = document.createElement('button');
    retry.id = 'ww-boot-retry';
    retry.type = 'button';
    retry.textContent = 'Retry loading';
    retry.addEventListener('click', function () { window.location.reload(); });
    card.appendChild(title);
    card.appendChild(mascot);
    card.appendChild(track);
    card.appendChild(message);
    card.appendChild(retry);
    layer.appendChild(card);
    document.body.appendChild(layer);
    var last = 0;
    var observer;
    var timer = window.setTimeout(function () {
      if (!layer.isConnected) return;
      message.textContent = 'Taking longer than expected…';
      retry.style.display = 'block';
    }, 30000);
    function finish() {
      if (observer) observer.disconnect();
      if (timer) window.clearTimeout(timer);
      layer.remove();
      window.__wwBootReady = null;
    }
    window.__wwBootReady = finish;
    function sync() {
      if (!layer.isConnected) return;
      if (notice.style.display === 'block') { finish(); return; }
      if (!nativeBar.hasAttribute('value') || !nativeBar.hasAttribute('max')) return;
      var loaded = Number(nativeBar.value);
      var total = Number(nativeBar.max);
      if (!Number.isFinite(loaded) || !Number.isFinite(total) || total <= 0) return;
      var next = Math.max(last, Math.min(1, Math.max(0, loaded / total)));
      if (next <= last) return;
      last = next;
      fill.style.transform = 'scaleX(' + next + ')';
      track.setAttribute('aria-valuenow', String(Math.round(next * 100)));
      message.textContent = next < 1 ? 'Packing the expedition…' : 'Opening the game…';
    }
    observer = new MutationObserver(sync);
    observer.observe(nativeBar, { attributes: true, attributeFilter: ['value', 'max'] });
    observer.observe(notice, { attributes: true, attributeFilter: ['style'] });
    sync();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
})();
</script>

html/head_include="<script>
// iOS Safari: WebAudio obeys the ringer/silent switch, so the game is mute
// on most phones. Playing a real looping <audio> element inside the first
// user gesture flips the audio session to 'playback', which ignores the
// switch. The element plays a tiny silent wav forever; WebAudio then routes
// normally.
(function () {
  var unlocked = false;
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    try {
      var el = document.createElement('audio');
      el.setAttribute('x-webkit-airplay', 'deny');
      el.preload = 'auto';
      el.loop = true;
      // 1-sample silent wav data URI
      el.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
      el.play().catch(function () {});
      document.__ww_silent_keepalive = el;
    } catch (e) {}
    window.removeEventListener('touchend', unlock, true);
    window.removeEventListener('pointerup', unlock, true);
    window.removeEventListener('click', unlock, true);
  }
  window.addEventListener('touchend', unlock, true);
  window.addEventListener('pointerup', unlock, true);
  window.addEventListener('click', unlock, true);
})();
</script>
<script>
// Phones with devicePixelRatio 3 render 2.25x the pixels of dpr 2 for no
// visible gain at this art style — and the single-threaded WASM build pays
// for every one of them. Cap dpr before the engine reads it.
(function () {
  var d = window.devicePixelRatio || 1;
  if (d > 2) {
    try { Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; } }); } catch (e) {}
  }
})();
</script>
<script>
// Optional Clerk auth for the global leaderboard. The game polls
// window.__ww_auth via JavaScriptBridge; everything works signed out.
// Clerk's bundle is heavy, so it loads AFTER the game boots (idle) or on
// demand at the first sign-in tap — never in competition with WASM startup.
(function () {
  var auth = { ready: false, signedIn: false, name: '', token: '', loading: false };
  window.__ww_auth = auth;
  function refreshToken() {
    if (window.Clerk && window.Clerk.session) {
      window.Clerk.session.getToken().then(function (t) { auth.token = t || ''; }).catch(function () { auth.token = ''; });
    } else {
      auth.token = '';
    }
  }
  function sync() {
    var c = window.Clerk;
    auth.signedIn = !!(c && c.user);
    auth.name = c && c.user ? (c.user.username || c.user.fullName || 'Penguin') : '';
    refreshToken();
  }
  var pendingSignIn = false;
  function ensureClerk() {
    if (auth.loading || window.Clerk) return;
    auth.loading = true;
    var s = document.createElement('script');
    s.async = true;
    s.crossOrigin = 'anonymous';
    s.setAttribute('data-clerk-publishable-key', 'pk_test_c3R1bm5pbmctaGVuLTEzLmNsZXJrLmFjY291bnRzLmRldiQ');
    s.src = 'https://stunning-hen-13.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
    s.onload = function () {
      window.Clerk.load().then(function () {
        auth.ready = true;
        sync();
        window.Clerk.addListener(function () { sync(); });
        window.addEventListener('focus', sync);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) sync(); });
        setInterval(refreshToken, 45000);
        if (pendingSignIn) { pendingSignIn = false; try { window.Clerk.openSignIn({}); } catch (e) {} }
      }).catch(function () { auth.loading = false; });
    };
    document.head.appendChild(s);
  }
  auth.signIn = function () {
    if (window.Clerk && auth.ready) { try { window.Clerk.openSignIn({}); } catch (e) {} }
    else { pendingSignIn = true; ensureClerk(); }
  };
  auth.signOut = function () { try { if (window.Clerk) window.Clerk.signOut(); } catch (e) {} };
  // Load in the background once the page (and usually the WASM boot) is idle.
  window.addEventListener('load', function () {
    setTimeout(ensureClerk, 6000);
  });
})();
</script>
<script>
// Plain-fetch bridge for the game's API calls: Godot's HTTPRequest has web
// quirks, so on web the game starts a request here and polls for the result.
(function () {
  var api = { seq: 0, results: {} };
  window.__ww_api = api;
  api.start = function (method, url, token, body) {
    var id = ++api.seq;
    var headers = {};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    if (body) headers['Content-Type'] = 'application/json';
    fetch(url, { method: method, headers: headers, body: body || undefined })
      .then(function (r) {
        return r.text().then(function (t) {
          api.results[id] = { done: true, ok: r.ok, status: r.status, body: t };
        });
      })
      .catch(function (e) {
        api.results[id] = { done: true, ok: false, status: 0, body: String(e) };
      });
    return id;
  };
  api.poll = function (id) {
    var r = api.results[id];
    if (!r) return '';
    delete api.results[id];
    return JSON.stringify(r);
  };
})();
</script>
<script>
// Godot's shell emits the viewport meta before this include; extend it so the
// canvas draws under notches/home bars on iOS (safe-area handling is in-game).
(function () {
  var m = document.querySelector('meta[name=viewport]');
  if (m && m.content.indexOf('viewport-fit') === -1) m.content += ', viewport-fit=cover';
})();
</script>

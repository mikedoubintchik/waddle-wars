 'color:#0a1020;background:#7fd4ff;border:0;border-radius:999px;cursor:pointer;'\n      + 'touch-action:manipulation;';\n    button.addEventListener('click', function () { if (button.disabled) return; button.disabled = true; button.textContent = 'Reloading…'; location.reload(); });\n    host.appendChild(title);\n    host.appendChild(body);\n    host.appendChild(button);\n    document.body.appendChild(host);\n  }\n  window.addEventListener('webglcontextlost', function (e) {\n    if (e.target !== document.getElementById('canvas')) return;\n    e.preventDefault();\n    e.stopPropagation();\n    overlay();\n  }, true);\n  window.addEventListener('webglcontextrestored', function (e) {\n    if (e.target !== document.getElementById('canvas')) return;\n    // Recovery can repeat under memory pressure. Never restart automatically.\n    overlay();\n  }, true);\n})();\n</script>\n"
